[project]
name = "forge-fetch-agents"
version = "0.1.0"
description = "FORGE Front Desk and buyer uAgents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "uagents>=0.26.1",
  "openai>=1.0",
  "stripe>=10.0",
  "httpx>=0.28",
  "cosmpy>=0.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
